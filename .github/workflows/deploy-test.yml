name: SearchAPI deploy action (test)

on:
    pull_request:
      branches:
        - test
      types:
        - opened
        - reopened
        - synchronize
      paths:
        - '**.py'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: run test suite
        uses: ./.github/workflows/pytest-composite
        
  deploy-edc-test:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: edc-test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build
        uses: ./.github/workflows/search-api-composite
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          vpc-id: ${{ secrets.VPC_ID }}
          subnet-ids: ${{ secrets.SUBNET_IDS }}
          security-group: ${{ secrets.SECURITY_GROUP }}

  deploy-test:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build
        uses: ./.github/workflows/search-api-composite
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
